<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuitansi Kopi Sahaja</title>
<link rel="icon" type="image/png" href="assets/KopiSahajaKotakBiru.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/id.js"></script>

<style>
  @font-face{ font-family: 'SF Pro Display Heavy'; src: url('assets/fonts/SF-Pro-Display-Heavy.otf') format('opentype'); }
  @font-face{ font-family: 'SF Pro Display Heavy Italic'; src: url('assets/fonts/SF-Pro-Display-HeavyItalic.otf') format('opentype'); }
  @font-face{ font-family: 'SF Pro Display Light'; src: url('assets/fonts/SF-Pro-Display-Light.otf') format('opentype'); }
  @font-face{ font-family: 'SF Pro Display Semibold'; src: url('assets/fonts/SF-Pro-Display-Semibold.otf') format('opentype'); }

  :root{
    --body-bg: #41708d;
    --panel-bg: #ffffff;
    --ink-dark: #1c2b36;
    --ink-muted: #6b7c87;
    --accent: #41708d;
    --accent-dark: #2c5069;
    --danger: #e0503a;
    --header-label: #415e75;
    --total-color: #2a5070;
    --item-color: #1a1a1a;
    --bar-bg: #dedede;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: linear-gradient(155deg, #4a7893 0%, var(--body-bg) 55%, #35586c 100%);
    font-family: 'SF Pro Display Light', sans-serif;
    color: var(--ink-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #particlesCanvas { position: fixed; top:0; left:0; width:100vw; height:100vh; z-index: 0; pointer-events: none; }

  /* Login Card */
  #loginScreen{ min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px; position: relative; z-index: 10; }
  .login-card{ background: rgba(255, 255, 255, 0.94); border-radius: 40px; padding: 42px 36px 36px 36px; width: 100%; max-width: 380px; box-shadow: 0 35px 80px rgba(0, 0, 0, 0.18); text-align: center; }
  .login-card h1{ font-family: 'SF Pro Display Heavy', sans-serif; font-size: 21px; color: var(--accent-dark); }
  .login-card input[type="password"]{ width:100%; padding: 13px 18px; border-radius: 100px; border: 1.5px solid #d7dee2; margin: 16px 0; text-align: center; }
  .login-card button{ width:100%; padding: 13px; border-radius: 100px; border:none; background: var(--accent); color:#fff; cursor:pointer; font-weight: 600; }

  /* App Layout */
  #app{ display:none; position: relative; z-index: 10; }
  #app.visible{ display:block; }
  .topbar{ background: rgba(0,0,0,0.15); padding: 14px 22px; display:flex; justify-content: space-between; color:#fff; }
  .main-layout{ display:flex; flex-wrap: wrap; gap: 28px; padding: 32px 28px; max-width: 1080px; margin: 0 auto; justify-content: center; }

  /* Editor Panel */
  .editor-panel{ background: rgba(255,255,255,0.98); border-radius: 18px; padding: 26px; flex: 1 1 400px; max-width: 480px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
  .field-row{ display:flex; gap: 12px; margin-bottom: 18px; }
  .field-group{ flex:1; }
  input[type="text"], textarea, input[type="number"]{ width:100%; padding: 10px 12px; border-radius: 9px; border: 1.5px solid #d7dee2; }
  .item-row-editor{ display:grid; grid-template-columns: 52px 1fr 130px 34px; gap: 8px; margin-bottom: 10px; }
  .remove-row-btn{ width: 34px; height: 40px; border-radius: 9px; border: 1.5px solid #f0c7c0; background: #fdf1ef; color: var(--danger); display: flex; align-items: center; justify-content: center; cursor:pointer;}
  .download-btn{ width:100%; padding: 14px; border-radius: 12px; border:none; background: var(--accent-dark); color:#fff; cursor:pointer; font-family: 'SF Pro Display Heavy', sans-serif; }

  /* Preview Panel */
  .preview-panel{ flex: 1 1 420px; display:flex; justify-content:center; }
  .receipt-scale-wrap { width: 100%; max-width: 500px; border-radius: 14px; overflow: hidden; }
  #receiptCapture { background: var(--body-bg); position: relative; width: 500px; transform-origin: top left; }
  .receipt-frame{ padding: 15% 15% 10%; }
  .paper-wrap{ position: relative; width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.4); }
  .middle-content{ padding: 0 9%; }

  /* FIXED: Layout Baris Total */
  .total-row{ display:flex; align-items:flex-start; padding: 2% 0 3%; justify-content: space-between; position: relative; }
  .total-row .col-desc{ font-family: 'SF Pro Display Heavy', sans-serif; font-size: 12px; color: var(--total-color); flex: 1; margin-right: 15px; }
  .total-row .col-amt{ font-family: 'SF Pro Display Heavy', sans-serif; font-size: 12px; color: var(--total-color); text-align: right; white-space: nowrap; }

  /* FIXED: Stempel */
  .lunas-stamp { position: absolute; width: 140px; left: -102px; top: 50%; margin-top: 22px; transform: translateY(-50%) rotate(-10deg); z-index: 10; pointer-events: none; }

  @media (max-width: 768px){
    .main-layout{ flex-direction:column; padding: 16px; align-items: center; }
    .editor-panel, .preview-panel{ max-width: 100%; width: 100%; }
    .field-row { flex-direction: column; }
    .item-row-editor { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px; border: 1.5px solid #e2e8f0; border-radius: 12px; margin-bottom: 12px; }
    .item-row-editor input[type="number"] { order: 1; flex: 0 0 60px !important; }
    .item-row-editor input[type="text"] { order: 2; flex: 1; }
    .item-row-editor .remove-row-btn { order: 3; flex: 0 0 42px; }
    .item-row-editor .desc-inputs { order: 4; width: 100% !important; margin-top: 4px; }
  }
</style>
</head>
<body>

  <canvas id="particlesCanvas"></canvas>

  <div id="loginScreen" class="no-print">
    <div class="login-card">
      <img class="brand" src="assets/Logo.png" alt="Kopi Sahaja">
      <h1>Kuitansi Sahaja</h1>
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
      <button onclick="tryLogin()">Masuk</button>
      <div id="loginError"></div>
    </div>
  </div>

  <div id="app">
    <div class="topbar no-print">
      <h2>Kuitansi Kopi Sahaja</h2>
      <button class="logout-btn" onclick="logout()">Keluar</button>
    </div>

    <div class="main-layout">
      <div class="editor-panel no-print">
        <h3>Informasi Kwitansi</h3>
        <div class="field-row">
          <div class="field-group"><label>Nama</label><input type="text" id="inputNama" value="Ardian"></div>
          <div class="field-group"><label>No. Kuitansi</label><input type="text" id="inputNomor" value="001/KS/VIII/26"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><label>Detail Acara</label><textarea id="inputDetailAcara" rows="2">Komperta Tegal Kamulyan&#10;16 Agustus 2026; ±19.30</textarea></div>
          <div class="field-group"><label>Tanggal Pelunasan</label><input type="text" id="inputPelunasan" placeholder="Pilih Tanggal..."></div>
        </div>

        <h3>Daftar Item</h3>
        <div id="itemsEditor"></div>
        <button class="add-row-btn" onclick="addItemRow()">+ Tambah Baris Item</button>

        <h3>Status Pembayaran</h3>
        <input type="checkbox" id="inputLunas" checked onchange="renderReceipt()"> <label for="inputLunas">Tampilkan stempel LUNAS</label>
        <button class="download-btn" id="downloadBtn" onclick="downloadPDF()" style="margin-top:20px;">⬇ Unduh Kwitansi (PDF)</button>
      </div>

      <div class="preview-panel">
        <div class="receipt-scale-wrap" id="scaleWrap">
          <div id="receiptCapture">
            <div class="receipt-frame">
              <div class="paper-wrap" id="paperWrap">
                <img class="cap-img" src="assets/Top.png" alt="">
                <div class="middle-section"><div class="middle-bg" id="middleBg"></div><div class="middle-content">
                    <div class="meta-block" style="display:flex; justify-content:space-between; padding: 3.2% 0 2.6%;">
                      <div class="meta-col-left">
                        <div class="meta-item"><span style="font-size:8.5px">Nama:</span><div id="viewNama" style="font-weight:600; font-size:10.5px;">Ardian</div></div>
                        <div class="meta-item" style="margin-top:7px;"><span style="font-size:8.5px">Detail Acara:</span><div id="viewDetailAcara" style="font-weight:600; font-size:10.5px;">Komperta Tegal Kamulyan</div></div>
                      </div>
                      <div class="meta-col-right" style="text-align:right;">
                        <div class="meta-item"><span style="font-size:8.5px">No. Kuitansi:</span><div id="viewNomor" style="font-weight:600; font-size:10.5px;">001/KS/VIII/26</div></div>
                        <div class="meta-item" style="margin-top:7px;"><span style="font-size:8.5px">Pelunasan:</span><div id="viewPelunasan" style="font-weight:600; font-size:10.5px;">-</div></div>
                      </div>
                    </div>
                    <div style="display:flex; background: #dedede; padding: 2.6% 0; margin: 0 -9%; padding-left: 9%; padding-right: 9%; font-family: 'SF Pro Display Heavy Italic'; font-size: 10.5px; color: #415e75;">
                      <span style="width:14%">QTY</span><span style="flex:1; text-align:center;">DESC</span><span style="width:32%; text-align:center;">AMT</span>
                    </div>
                    <div class="items-list" id="viewItems" style="padding: 2.6% 0 1%;"></div>
                    <div class="total-row" id="totalRow">
                      <span class="col-desc">TOTAL</span><span class="col-amt" id="viewTotal">Rp 0,-</span>
                      <img class="lunas-stamp" id="lunasStamp" src="assets/Lunas.png" alt="Lunas">
                    </div>
                  </div>
                </div>
                <img class="cap-img" src="assets/Bottom.png" alt="">
              </div>
            </div>
            <img src="assets/Footer.png" style="width:100%; background:#fff; padding: 3.5% 9%;">
            <img class="paper-texture" src="assets/Texture.jpg" alt="">
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  let items = [ { qty: 1, desc: "Sahaja Cart Event Package", subDesc: "Kopsu Aren (52 Cups)", amt: 1000000 } ];

  // Particles logic
  function initParticles() {
    const canvas = document.getElementById('particlesCanvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let width, height, particles;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    class Particle {
      constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.6; this.vy = -Math.random() * 0.8 - 0.2; this.radius = Math.random() * 1.8 + 0.6; }
      update() { this.x += this.vx; this.y += this.vy; if (this.y < 0) { this.y = height + 10; this.x = Math.random() * width; } if (this.x < 0 || this.x > width) this.vx = -this.vx; }
      draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 243, 224, 0.55)'; ctx.fill(); }
    }
    function init() { resize(); particles = []; for (let i = 0; i < 40; i++) particles.push(new Particle()); window.addEventListener('resize', resize); animate(); }
    function animate() { ctx.clearRect(0, 0, width, height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
    init();
  }

  function tryLogin(){
    if(document.getElementById('passwordInput').value === "@Nara2026!"){
      sessionStorage.setItem('nara_kwitansi_auth', '1');
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('particlesCanvas').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      initApp();
    } else { alert('Password salah'); }
  }

  function initApp(){
    flatpickr("#inputPelunasan", { locale: "id", dateFormat: "j F Y", defaultDate: "today" });
    renderItemsEditor(); renderReceipt();
  }

  function renderItemsEditor(){
    const container = document.getElementById('itemsEditor'); container.innerHTML = '';
    items.forEach((item, idx)=>{
      const row = document.createElement('div'); row.className = 'item-row-editor';
      row.innerHTML = `<input type="number" value="${item.qty}" oninput="items[${idx}].qty=this.value; renderReceipt()">
                       <div class="desc-inputs"><textarea oninput="items[${idx}].desc=this.value; renderReceipt()">${item.desc}</textarea></div>
                       <input type="text" value="${item.amt}" oninput="items[${idx}].amt=this.value; renderReceipt()">
                       <button class="remove-row-btn" onclick="items.splice(${idx},1); renderItemsEditor(); renderReceipt()">✕</button>`;
      container.appendChild(row);
    });
  }

  function renderReceipt(){
    document.getElementById('viewNama').textContent = document.getElementById('inputNama').value;
    document.getElementById('viewDetailAcara').textContent = document.getElementById('inputDetailAcara').value;
    document.getElementById('viewNomor').textContent = document.getElementById('inputNomor').value;
    document.getElementById('viewPelunasan').textContent = document.getElementById('inputPelunasan').value;

    const list = document.getElementById('viewItems'); list.innerHTML = '';
    let total = 0;
    items.forEach(i=>{
      total += Number(i.amt);
      list.innerHTML += `<div style="display:flex; padding-bottom:10px;"><span style="width:14%; font-size:11px;">${i.qty}</span><span style="flex:1; font-size:11px;">${i.desc}</span><span style="width:32%; text-align:right; font-size:11px;">Rp ${Number(i.amt).toLocaleString('id-ID')},-</span></div>`;
    });
    document.getElementById('viewTotal').textContent = `Rp ${total.toLocaleString('id-ID')},-`;
    document.getElementById('totalPreviewText').textContent = `Rp ${total.toLocaleString('id-ID')},-`;
    document.getElementById('lunasStamp').style.display = document.getElementById('inputLunas').checked ? 'block' : 'none';
  }

  async function downloadPDF(){
    const el = document.getElementById('receiptCapture');
    html2pdf().set({
        margin: 0,
        filename: 'Kuitansi.pdf',
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'px', format: [500, el.offsetHeight], orientation: 'portrait' }
    }).from(el).save();
  }

  window.onload = () => {
    if(sessionStorage.getItem('nara_kwitansi_auth') === '1'){
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      initApp();
    } else { initParticles(); }
  };
</script>
</body>
</html>
