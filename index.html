<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuitansi Kopi Sahaja</title>
<link rel="icon" type="image/png" href="assets/Logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  @font-face{
    font-family: 'SF Pro Display Heavy';
    src: url('assets/fonts/SF-Pro-Display-Heavy.otf') format('opentype');
    font-weight: 800; font-style: normal; font-display: swap;
  }
  @font-face{
    font-family: 'SF Pro Display Heavy Italic';
    src: url('assets/fonts/SF-Pro-Display-HeavyItalic.otf') format('opentype');
    font-weight: 800; font-style: italic; font-display: swap;
  }
  @font-face{
    font-family: 'SF Pro Display Light';
    src: url('assets/fonts/SF-Pro-Display-Light.otf') format('opentype');
    font-weight: 300; font-style: normal; font-display: swap;
  }

  :root{
    --body-bg: #41708d;
    --panel-bg: #ffffff;
    --panel-border: #dfe6ea;
    --ink-dark: #1c2b36;
    --ink-muted: #6b7c87;
    --accent: #41708d;
    --accent-dark: #2c5069;
    --danger: #e0503a;
    --header-label: #415e75;
    --total-color: #2a5070;
    --item-color: #1a1a1a;
    --bar-bg: #dedede;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: linear-gradient(155deg, #4a7893 0%, var(--body-bg) 55%, #35586c 100%);
    font-family: 'SF Pro Display Light', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink-dark);
    min-height: 100vh;
    animation: bodyFadeIn .5s ease both;
  }

  /* ---------------- ANIMATIONS ---------------- */
  @keyframes bodyFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes fadeInUp{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes fadeInDown{
    from{ opacity:0; transform: translateY(-14px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes fadeInScale{
    from{ opacity:0; transform: scale(.94); }
    to{ opacity:1; transform: scale(1); }
  }
  @keyframes rowIn{
    from{ opacity:0; transform: translateX(-8px); }
    to{ opacity:1; transform: translateX(0); }
  }
  @keyframes shake{
    10%,90%{ transform: translateX(-1px); }
    20%,80%{ transform: translateX(2px); }
    30%,50%,70%{ transform: translateX(-4px); }
    40%,60%{ transform: translateX(4px); }
  }
  @keyframes pulseTotal{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.06); }
    100%{ transform: scale(1); }
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  @keyframes stampPop{
    0%{ opacity:0; transform: scale(.5) rotate(-18deg); }
    70%{ opacity:1; transform: scale(1.08) rotate(-8deg); }
    100%{ opacity:1; transform: scale(1) rotate(-10deg); }
  }

  .anim-shake{ animation: shake .4s ease; }
  .anim-pulse{ animation: pulseTotal .35s ease; }

  /* ---------------- LOGIN SCREEN ---------------- */
  #loginScreen{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }
  .login-card{
    background: #fff;
    border-radius: 18px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    text-align:center;
    animation: fadeInScale .5s cubic-bezier(.2,.8,.3,1) both;
  }
  .login-card img.brand{
    width: 140px;
    margin: 0 auto 18px;
    display:block;
    animation: fadeInDown .6s ease both;
  }
  .login-card h1{
    font-family: 'SF Pro Display Heavy', sans-serif;
    font-size: 20px;
    margin: 0 0 6px;
    color: var(--accent-dark);
  }
  .login-card p{
    font-size: 13px;
    color: var(--ink-muted);
    margin: 0 0 22px;
  }
  .login-card input[type="password"]{
    width:100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid #d7dee2;
    font-size: 15px;
    outline:none;
    margin-bottom: 12px;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .login-card input[type="password"]:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(65,112,141,0.15);
  }
  .login-card button{
    width:100%;
    padding: 12px 14px;
    border-radius: 10px;
    border:none;
    background: var(--accent);
    color:#fff;
    font-size: 15px;
    font-family: 'SF Pro Display Heavy', sans-serif;
    cursor:pointer;
    transition: background .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .login-card button:hover{ background: var(--accent-dark); box-shadow: 0 6px 16px rgba(44,80,105,0.35); }
  .login-card button:active{ transform: scale(.97); }
  #loginError{
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }

  /* ---------------- APP LAYOUT ---------------- */
  #app{ display:none; }
  #app.visible{ display:block; }

  .topbar{
    background: rgba(0,0,0,0.2);
    padding: 14px 22px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    color:#fff;
    animation: fadeInDown .45s ease both;
  }
  .topbar h2{
    font-family: 'SF Pro Display Heavy', sans-serif;
    font-size: 16px;
    margin:0;
    letter-spacing: .3px;
  }
  .logout-btn{
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.35);
    color:#fff;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    cursor:pointer;
    transition: background .15s ease, transform .12s ease;
  }
  .logout-btn:hover{ background: rgba(255,255,255,0.28); }
  .logout-btn:active{ transform: scale(.95); }

  .main-layout{
    display:flex;
    flex-wrap: wrap;
    gap: 28px;
    padding: 28px;
    max-width: 1400px;
    margin: 0 auto;
    align-items:flex-start;
  }

  /* ---------------- EDITOR PANEL ---------------- */
  .editor-panel{
    background: var(--panel-bg);
    border-radius: 16px;
    padding: 24px;
    flex: 1 1 400px;
    max-width: 480px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    animation: fadeInUp .5s .05s cubic-bezier(.2,.8,.3,1) both;
    transition: box-shadow .2s ease;
  }
  .editor-panel h3{
    font-family: 'SF Pro Display Heavy', sans-serif;
    font-size: 15px;
    color: var(--accent-dark);
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--panel-border);
  }
  .field-group{ margin-bottom: 18px; }
  .field-row{ display:flex; gap: 12px; }
  .field-row .field-group{ flex:1; }
  label{
    display:block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  input[type="text"], input[type="date"], textarea, input[type="number"]{
    width:100%;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1.5px solid #d7dee2;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink-dark);
    outline:none;
    resize: vertical;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  input:focus, textarea:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(65,112,141,0.13);
  }

  .items-table{ margin-top: 4px; }
  .item-row-editor{
    display:grid;
    grid-template-columns: 56px 1fr 130px 34px;
    gap: 8px;
    margin-bottom: 10px;
    align-items:start;
    animation: rowIn .3s ease both;
    transition: opacity .18s ease, transform .18s ease;
  }
  .item-row-editor.removing{
    opacity: 0;
    transform: translateX(10px);
  }
  .item-row-editor textarea{ min-height: 40px; }
  .remove-row-btn{
    width: 34px;
    height: 40px;
    border-radius: 9px;
    border: 1.5px solid #f0c7c0;
    background: #fdf1ef;
    color: var(--danger);
    font-size: 16px;
    cursor:pointer;
    line-height:1;
    transition: background .15s ease, transform .12s ease;
  }
  .remove-row-btn:hover{ background: #fbe3de; }
  .remove-row-btn:active{ transform: scale(.9); }
  .col-labels{
    display:grid;
    grid-template-columns: 56px 1fr 130px 34px;
    gap: 8px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: var(--ink-muted);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .add-row-btn{
    width:100%;
    padding: 10px;
    border-radius: 9px;
    border: 1.5px dashed var(--accent);
    background: #eef4f7;
    color: var(--accent-dark);
    font-size: 13.5px;
    font-weight: 600;
    cursor:pointer;
    margin-top: 4px;
    transition: background .15s ease, transform .12s ease;
  }
  .add-row-btn:hover{ background: #e2edf2; }
  .add-row-btn:active{ transform: scale(.98); }

  .checkbox-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 10px 4px;
  }
  .checkbox-row input[type="checkbox"]{ width:18px; height:18px; accent-color: var(--accent); transition: transform .12s ease; }
  .checkbox-row input[type="checkbox"]:active{ transform: scale(.9); }
  .checkbox-row label{ margin:0; text-transform:none; font-size:14px; color: var(--ink-dark); font-weight:500; }

  .total-preview{
    display:flex;
    justify-content: space-between;
    align-items:center;
    background: #f4f7f9;
    border-radius: 10px;
    padding: 12px 14px;
    margin: 6px 0 20px;
    font-weight: 700;
    color: var(--accent-dark);
    transition: background .2s ease;
  }
  .total-preview span#totalPreviewText{ display:inline-block; }

  .download-btn{
    width:100%;
    padding: 14px;
    border-radius: 11px;
    border:none;
    background: var(--accent-dark);
    color:#fff;
    font-size: 15px;
    font-family: 'SF Pro Display Heavy', sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    transition: background .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .download-btn:hover{ background: #234258; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
  .download-btn:active:not(:disabled){ transform: scale(.98); }
  .download-btn:disabled{ opacity:.6; cursor:default; }
  .pdf-hint{
    margin-top: 10px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-muted);
    text-align: center;
  }

  .spinner{
    width: 15px;
    height: 15px;
    border: 2.5px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    display:inline-block;
    animation: spin .7s linear infinite;
  }

  /* ---------------- PREVIEW / RECEIPT ---------------- */
  .preview-panel{
    flex: 1 1 420px;
    display:flex;
    justify-content:center;
    animation: fadeInUp .5s .12s cubic-bezier(.2,.8,.3,1) both;
  }
  .receipt-scale-wrap{
    width:100%;
    max-width: 500px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 46px rgba(0,0,0,0.3);
  }

  #receiptCapture{
    background: var(--body-bg);
    position: relative;
  }

  /* Frame that holds the paper receipt with breathing room on all sides,
     matching the reference preview mock-up. */
  .receipt-frame{
    background: var(--body-bg);
    padding: 15% 15% 10%;
  }
  .paper-wrap{
      position: relative;
      width: 100%;
      /* Shadow dipergelap dan diperbesar agar html2canvas bisa menangkapnya */
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      animation: fadeInScale .5s .2s cubic-bezier(.2,.8,.3,1) both;
    }
  .paper-texture{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit: cover;
    mix-blend-mode: multiply;
    opacity: 0.22;
    pointer-events:none;
    z-index: 6;
  }
  img.cap-img{
    display:block;
    width:100%;
    height:auto;
  }

  .middle-section{
      position: relative;
      width:100%;
      z-index: 1;
      margin-top: -1px; /* Menarik bagian tengah ke atas untuk menutup celah */
      margin-bottom: -1px; /* Menarik bagian bawah ke atas untuk menutup celah */
    }
  .middle-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index: 0;
    line-height:0;
  }
  .middle-bg img{
    display:block;
    width:100%;
    height:auto;
  }
  .middle-content{
    position:relative;
    z-index: 1;
    padding: 0 9%;
  }

  .meta-block{
    text-align:center;
    padding: 3.2% 0 2.6%;
  }
  .kwitansi-no{
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: .3px;
    margin-bottom: 4px;
    font-family: 'SF Pro Display Light', sans-serif;
  }
  .kwitansi-date{
    font-size: 14.5px;
    color: var(--item-color);
    font-family: 'SF Pro Display Light', sans-serif;
  }

  .table-header-bar{
    display:flex;
    background: var(--bar-bg);
    padding: 2.6% 0;
    margin: 0 -9%;
    padding-left: 9%;
    padding-right: 9%;
  }
  .col-qty{ width: 14%; }
  .col-desc{ flex:1; }
  .col-amt{ width: 32%; text-align:right; }

  /* Membuat khusus teks header "AMT" menjadi rata tengah */
    .table-header-bar .col-amt {
      text-align: center;
    }

  .table-header-bar .col-qty,
  .table-header-bar .col-desc,
  .table-header-bar .col-amt{
    font-family: 'SF Pro Display Heavy Italic', sans-serif;
    font-style: italic;
    font-weight: 800;
    font-size: 12px;
    color: var(--header-label);
  }

  .items-list{ padding: 2.6% 0 1%; }
  .item-row{
    display:flex;
    padding-bottom: 2.4%;
  }
  .item-row .col-qty,
  .item-row .col-desc{
    font-family: 'SF Pro Display Light', sans-serif;
    font-size: 12.5px;
    color: var(--item-color);
    white-space: pre-line;
    line-height: 1.5;
  }
  .item-row .col-amt{
      font-family: 'SF Pro Display Light', sans-serif;
      font-size: 12.5px;
      color: var(--item-color);
      white-space: nowrap;
      text-align: right;
    }

  .total-row{
    display:flex;
    align-items:center;
    padding: 2% 0 3%;
  }
  .total-row .col-qty{ width:14%; }
  .total-row .col-desc{
    font-family: 'SF Pro Display Heavy', sans-serif;
    font-weight: 800;
    font-size: 13.5px;
    color: var(--total-color);
  }
  .total-row .col-amt{
      font-family: 'SF Pro Display Heavy', sans-serif;
      font-weight: 800;
      font-size: 13.5px;
      color: var(--total-color);
      white-space: nowrap;
      text-align: right;
    }

  .bottom-section{
      position: relative;
      width:100%;
      margin-top: -1px; /* Memastikan celah bawah rapat */
    }
  .lunas-stamp{
    position:absolute;
    z-index: 5;
    mix-blend-mode: normal;
    filter: drop-shadow(0 10px 16px rgba(0,0,0,0.35));
    pointer-events:none;
    transform: rotate(-10deg);
    animation: stampPop .45s cubic-bezier(.3,1.4,.5,1) both;
  }

  .footer-section{
    background:#fff;
    padding: 3.5% 9%;
  }
  .footer-section img{
    display:block;
    width:100%;
    height:auto;
    max-width: 420px;
    margin: 0 auto;
  }

  /* Receipt content should read like a printed document: not selectable,
     and it also guarantees the exported PDF (rasterized via html2canvas)
     never contains an editable/selectable text layer. */
  #receiptCapture, #receiptCapture *{
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
  }

  @media (max-width: 860px){
    .main-layout{ flex-direction:column; padding: 16px; }
    .editor-panel{ max-width: 100%; }
    .preview-panel{ max-width:100%; }
  }

  /* On narrow phones the receipt paper itself renders smaller (frame
     margins take a % of a smaller viewport), so nudge the fixed text
     sizes down a bit to avoid crowding — plain media query, no
     container queries, so this stays fully compatible with the
     html2canvas-based PDF export. */
  @media (max-width: 480px){
    .kwitansi-no{ font-size: 9.5px; }
    .kwitansi-date{ font-size: 12.5px; }
    .table-header-bar .col-qty,
    .table-header-bar .col-desc,
    .table-header-bar .col-amt{ font-size: 10.5px; }
    .item-row .col-qty,
    .item-row .col-desc,
    .item-row .col-amt{ font-size: 11px; }
    .total-row .col-desc,
    .total-row .col-amt{ font-size: 12px; }
  }

  /* ---------------- MANUAL PRINT FALLBACK (Ctrl+P) ----------------
     The download button uses html2canvas (below) for a direct one-click
     PDF download. These rules just make sure that if someone manually
     prints the page (Ctrl/Cmd+P) instead, only the receipt itself shows,
     enlarged to use the full printable page width. */
  @media print{
    @page{ margin: 10mm; }
    html, body{ background:#fff !important; height:auto !important; }
    body{ animation:none !important; }
    .no-print{ display:none !important; }
    #app{ display:block !important; }
    .main-layout{ padding:0 !important; display:block !important; }
    .preview-panel{
      max-width:100% !important;
      display:block !important;
      animation:none !important;
    }
    .receipt-scale-wrap{
      max-width:520px !important;
      width:100% !important;
      margin:0 auto !important;
      box-shadow:none !important;
      border-radius:0 !important;
    }
    #receiptCapture{ animation:none !important; }
    .paper-wrap, .lunas-stamp{ animation:none !important; }
  }
</style>
</head>
<body>

  <!-- ================= LOGIN SCREEN ================= -->
  <div id="loginScreen" class="no-print">
    <div class="login-card">
      <img class="brand" src="assets/Logo.png" alt="Kopi Sahaja">
      <h1>Kuitansi Sahaja</h1>
      <p>Masukkan password untuk mengakses editor</p>
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
      <button onclick="tryLogin()">Masuk</button>
      <div id="loginError"></div>
    </div>
  </div>

  <!-- ================= MAIN APP ================= -->
  <div id="app">
    <div class="topbar no-print">
      <h2>Kuitansi Sahaja</h2>
      <button class="logout-btn" onclick="logout()">Keluar</button>
    </div>

    <div class="main-layout">

      <!-- -------- EDITOR PANEL -------- -->
      <div class="editor-panel no-print">
        <h3>Informasi Kwitansi</h3>
        <div class="field-row">
          <div class="field-group">
            <label>No. Kwitansi</label>
            <input type="text" id="inputNomor" value="001/KS/X/2025">
          </div>
          <div class="field-group">
            <label>Tanggal</label>
            <input type="date" id="inputTanggal">
          </div>
        </div>

        <h3>Daftar Item</h3>
        <div class="items-table">
          <div class="col-labels">
            <span>Qty</span><span>Deskripsi</span><span>Jumlah (Rp)</span><span></span>
          </div>
          <div id="itemsEditor"></div>
        </div>
        <button class="add-row-btn" onclick="addItemRow()">+ Tambah Baris Item</button>

        <h3 style="margin-top:22px;">Status Pembayaran</h3>
        <div class="checkbox-row">
          <input type="checkbox" id="inputLunas" checked onchange="renderReceipt()">
          <label for="inputLunas">Tampilkan stempel LUNAS</label>
        </div>

        <div class="total-preview">
          <span>Total</span>
          <span id="totalPreviewText">Rp 0,-</span>
        </div>

        <button class="download-btn" id="downloadBtn" onclick="downloadPDF()">⬇ Unduh Kwitansi (PDF)</button>
        <div class="pdf-hint">File PDF akan otomatis terunduh ke perangkat kamu.</div>
      </div>

      <!-- -------- PREVIEW PANEL -------- -->
      <div class="preview-panel">
        <div class="receipt-scale-wrap">
          <div id="receiptCapture">
            <div class="receipt-frame">
              <div class="paper-wrap" id="paperWrap">
                <img class="cap-img" src="assets/Top.png" alt="">

                <div class="middle-section" id="middleSection">
                  <div class="middle-bg" id="middleBg"></div>
                  <div class="middle-content">
                    <div class="meta-block">
                      <div class="kwitansi-no" id="viewNomor">No. 001/KS/X/2025</div>
                      <div class="kwitansi-date" id="viewTanggal">30/10/2025</div>
                    </div>

                    <div class="table-header-bar">
                      <span class="col-qty">QTY</span>
                      <span class="col-desc">DESC</span>
                      <span class="col-amt">AMT</span>
                    </div>

                    <div class="items-list" id="viewItems"></div>

                    <div class="total-row" id="totalRow">
                      <span class="col-qty"></span>
                      <span class="col-desc">TOTAL</span>
                      <span class="col-amt" id="viewTotal">Rp 0,-</span>
                    </div>
                  </div>
                </div>

                <div class="bottom-section">
                  <img class="cap-img" src="assets/Bottom.png" alt="">
                </div>

                <img class="lunas-stamp" id="lunasStamp" src="assets/Lunas.png" alt="Lunas">
              </div>
            </div>

            <div class="footer-section">
              <img src="assets/Footer.png" alt="Kopi Sahaja">
            </div>

            <img class="paper-texture" src="assets/Texture.jpg" alt="">
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
  const APP_PASSWORD = "@Nara2026!";

  function tryLogin(){
    const val = document.getElementById('passwordInput').value;
    const err = document.getElementById('loginError');
    const card = document.querySelector('.login-card');
    if(val === APP_PASSWORD){
      sessionStorage.setItem('nara_kwitansi_auth', '1');
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      initApp();
    } else {
      err.textContent = 'Password salah, silakan coba lagi.';
      card.classList.remove('anim-shake');
      void card.offsetWidth; // restart animation
      card.classList.add('anim-shake');
    }
  }
  document.getElementById('passwordInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') tryLogin();
  });

  function logout(){
    sessionStorage.removeItem('nara_kwitansi_auth');
    document.getElementById('app').classList.remove('visible');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('passwordInput').value = '';
  }

  // auto-login if already authenticated this session
  window.addEventListener('DOMContentLoaded', ()=>{
    if(sessionStorage.getItem('nara_kwitansi_auth') === '1'){
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      initApp();
    }
  });

  // ---------------- STATE ----------------
  let items = [
    { qty: 1, desc: "Sahaja Cart Event Package\n400 cups", amt: 4000000 }
  ];
  let rowIdCounter = 0;

  function todayISO(){
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }

  const ROMAN_MONTHS = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  const ROMAN_MONTH_SET = new Set(ROMAN_MONTHS);

  // Keeps the bulan (roman numeral) & tahun segments of "No. Kwitansi" in sync
  // with the selected tanggal, e.g. "001/KS/X/2025" -> bulan/tahun auto-updated
  // while the running number / prefix parts the user typed are preserved.
  function syncNomorWithTanggal(){
    const tglVal = document.getElementById('inputTanggal').value;
    if(!tglVal) return;
    const [y, m] = tglVal.split('-');
    const monthIdx = parseInt(m, 10);
    if(!monthIdx || monthIdx < 1 || monthIdx > 12) return;
    const romanMonth = ROMAN_MONTHS[monthIdx - 1];

    const nomorInput = document.getElementById('inputNomor');
    const parts = nomorInput.value.split('/').map(p => p.trim());

    if(parts.length >= 2){
      const lastIdx = parts.length - 1;
      const secondLastIdx = parts.length - 2;
      const lastLooksLikeYear = /^\d{4}$/.test(parts[lastIdx]);
      const secondLastLooksLikeMonth = ROMAN_MONTH_SET.has(parts[secondLastIdx].toUpperCase()) || parts[secondLastIdx] === '';
      if(lastLooksLikeYear || secondLastLooksLikeMonth){
        parts[secondLastIdx] = romanMonth;
        parts[lastIdx] = y;
        nomorInput.value = parts.join('/');
      }
    }
  }

  function initApp(){
    if(!document.getElementById('inputTanggal').value){
      document.getElementById('inputTanggal').value = todayISO();
    }
    syncNomorWithTanggal();
    renderItemsEditor();
    renderReceipt();
    checkAssetsLoaded();
    document.getElementById('inputNomor').addEventListener('input', renderReceipt);
    document.getElementById('inputTanggal').addEventListener('input', () => {
      syncNomorWithTanggal();
      renderReceipt();
    });
  }

  // Surfaces a clear, visible warning directly on the page if any image
  // asset 404s — so a broken deploy (e.g. assets/ folder not fully
  // uploaded) is obvious immediately, without needing to open DevTools.
  function checkAssetsLoaded(){
    setTimeout(() => {
      const imgs = Array.from(document.querySelectorAll('#receiptCapture img, .login-card img'));
      const broken = imgs.filter(img => img.complete && img.naturalWidth === 0);
      if(broken.length === 0) return;

      const names = broken.map(img => img.src.split('/').pop()).join(', ');
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#c0392b;color:#fff;' +
        'padding:10px 16px;font-size:13px;text-align:center;font-family:sans-serif;';
      banner.innerHTML = '⚠️ ' + broken.length + ' file gambar gagal dimuat (' + names + '). ' +
        'Cek apakah folder <b>assets/</b> sudah ter-upload lengkap ke server, lalu refresh halaman.';
      document.body.prepend(banner);
    }, 1200);
  }

  function formatRupiah(num){
    if(isNaN(num)) num = 0;
    return "Rp " + Number(num).toLocaleString('id-ID') + ",-";
  }

  function formatDate(isoStr){
    if(!isoStr) return "";
    const [y,m,d] = isoStr.split('-');
    return `${d}/${m}/${y}`;
  }

  function addItemRow(){
    items.push({ qty: 1, desc: "", amt: 0 });
    renderItemsEditor();
    renderReceipt();
  }

  function removeItemRow(idx){
    const rows = document.querySelectorAll('#itemsEditor .item-row-editor');
    const rowEl = rows[idx];
    if(rowEl){
      rowEl.classList.add('removing');
      setTimeout(()=>{
        items.splice(idx,1);
        renderItemsEditor();
        renderReceipt();
      }, 160);
    } else {
      items.splice(idx,1);
      renderItemsEditor();
      renderReceipt();
    }
  }

  function renderItemsEditor(){
    const container = document.getElementById('itemsEditor');
    container.innerHTML = '';
    items.forEach((item, idx)=>{
      const row = document.createElement('div');
      row.className = 'item-row-editor';
      row.innerHTML = `
        <input type="number" min="0" value="${item.qty}" oninput="updateItem(${idx},'qty',this.value)">
        <textarea oninput="updateItem(${idx},'desc',this.value)" placeholder="Deskripsi item...">${item.desc}</textarea>
        <input type="text" inputmode="numeric" value="${item.amt ? Number(item.amt).toLocaleString('id-ID') : ''}"
               placeholder="0"
               onfocus="this.value = this.value.replace(/\\./g,'')"
               oninput="formatAmtInput(this); updateItem(${idx},'amt', this.value.replace(/\\./g,''))"
               onblur="this.value = this.value ? Number(this.value.replace(/\\./g,'')).toLocaleString('id-ID') : ''">
        <button class="remove-row-btn" onclick="removeItemRow(${idx})" title="Hapus baris">✕</button>
      `;
      container.appendChild(row);
    });
  }

  function formatAmtInput(el){
    let raw = el.value.replace(/\D/g,'');
    el.value = raw ? Number(raw).toLocaleString('id-ID') : '';
  }

  function updateItem(idx, field, value){
    if(field === 'qty') items[idx].qty = parseInt(value) || 0;
    else if(field === 'amt') items[idx].amt = parseInt(value) || 0;
    else items[idx][field] = value;
    renderReceipt();
  }

  function renderReceipt(){
    document.getElementById('viewNomor').textContent = 'No. ' + (document.getElementById('inputNomor').value || '-');
    document.getElementById('viewTanggal').textContent = formatDate(document.getElementById('inputTanggal').value);

    const viewItems = document.getElementById('viewItems');
    viewItems.innerHTML = '';
    let total = 0;
    items.forEach(item=>{
      total += (Number(item.amt) || 0);
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <span class="col-qty">${item.qty || 0}</span>
        <span class="col-desc">${escapeHtml(item.desc || '')}</span>
        <span class="col-amt">${formatRupiah(item.amt || 0)}</span>
      `;
      viewItems.appendChild(row);
    });

    document.getElementById('viewTotal').textContent = formatRupiah(total);

    const totalPreviewEl = document.getElementById('totalPreviewText');
    const totalPreviewBox = totalPreviewEl.closest('.total-preview');
    if(totalPreviewEl.textContent !== formatRupiah(total) && totalPreviewBox){
      totalPreviewBox.classList.remove('anim-pulse');
      void totalPreviewBox.offsetWidth;
      totalPreviewBox.classList.add('anim-pulse');
    }
    totalPreviewEl.textContent = formatRupiah(total);

    document.getElementById('lunasStamp').style.display =
      document.getElementById('inputLunas').checked ? 'block' : 'none';

    requestAnimationFrame(()=>{
      tileMiddleBackground();
      positionStamp();
    });
  }

  // Fill the middle (table) area with repeating Middle.webp tiles using real
  // <img> elements instead of CSS background-image, since html2canvas (used
  // for PDF export) frequently fails to render repeating CSS backgrounds.
  const MIDDLE_ASPECT = 872 / 1600; // height / width of Middle.png
  function tileMiddleBackground(){
    const middleSection = document.getElementById('middleSection');
    const middleContent = middleSection.querySelector('.middle-content');
    const bg = document.getElementById('middleBg');
    if(!middleSection || !middleContent || !bg) return;

    const contentHeight = middleContent.offsetHeight;
    const width = middleSection.offsetWidth || 1;
    const tileHeight = width * MIDDLE_ASPECT;
    const tileCount = Math.max(1, Math.ceil(contentHeight / tileHeight) + 1);

    bg.style.height = contentHeight + 'px';

    if(bg.childElementCount !== tileCount){
      bg.innerHTML = '';
      for(let i = 0; i < tileCount; i++){
        const img = document.createElement('img');
        img.src = 'assets/Middle.png';
        img.alt = '';
        bg.appendChild(img);
      }
    }
  }

  // Anchor the LUNAS stamp to the TOTAL row so it stays correctly placed
  // no matter how many item rows are added (instead of a fixed % offset).
  function positionStamp(){
      const wrap = document.getElementById('paperWrap');
      const totalRow = document.getElementById('totalRow');
      const stamp = document.getElementById('lunasStamp');
      if(!wrap || !totalRow || !stamp) return;

      const wrapRect = wrap.getBoundingClientRect();
      const totalRect = totalRow.getBoundingClientRect();
      if(wrapRect.width === 0) return;

      const stampWidth = wrapRect.width * 0.35;
      const totalCenterY = (totalRect.top - wrapRect.top) + (totalRect.height / 2);

      stamp.style.width = stampWidth + 'px';
      // PERBAIKAN: Angka diubah dari -0.15 menjadi -0.28 agar lebih ke kiri
      stamp.style.left = (-stampWidth * 0.28) + 'px';
      stamp.style.top = (totalCenterY - stampWidth * 0.32) + 'px';
    }

  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      tileMiddleBackground();
      positionStamp();
    }, 120);
  });

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>{
      tileMiddleBackground();
      positionStamp();
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------------- PDF EXPORT (direct download) ----------------
  function waitForImagesToLoad(container){
    const imgs = Array.from(container.querySelectorAll('img'));
    return Promise.all(imgs.map(img => {
      if(img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(resolve => {
        img.addEventListener('load', resolve, { once:true });
        img.addEventListener('error', resolve, { once:true });
        setTimeout(resolve, 4000);
      });
    }));
  }

  // html2canvas clones the page into an off-screen container while it
  // rasterizes. If it errors or hangs mid-render, that clone can be left
  // behind and — on some browsers — ends up intercepting clicks on the
  // whole page. This snapshots what's on <body> beforehand so we can
  // forcibly remove anything unexpected afterwards no matter what happens.
  function cleanupStrayOverlays(before){
    Array.from(document.body.children).forEach(child => {
      if(!before.has(child)) child.remove();
    });
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
    document.body.style.pointerEvents = '';
    document.body.style.position = '';
  }

  function withTimeout(promise, ms, label){
    let timer;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(new Error(label || 'Proses terlalu lama, dibatalkan.')), ms);
    });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
  }

  async function downloadPDF(){
      const btn = document.getElementById('downloadBtn');
      const originalLabel = '⬇ Unduh Kwitansi (PDF)';
      let statusEl = document.getElementById('pdfStatus');
      if(!statusEl){
        statusEl = document.createElement('div');
        statusEl.id = 'pdfStatus';
        statusEl.style.cssText = 'margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--danger);display:none;';
        btn.insertAdjacentElement('afterend', statusEl);
      }
      statusEl.style.display = 'none';
      statusEl.textContent = '';

      function showError(msg){
        btn.disabled = false;
        btn.textContent = originalLabel;
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = msg;
        statusEl.style.display = 'block';
        console.error('PDF export error:', msg);
      }

      if(typeof html2pdf === 'undefined'){
        showError('Library pembuat PDF gagal dimuat dari internet (CDN). Cek koneksi internet perangkat, nonaktifkan ad-blocker jika ada, lalu muat ulang halaman.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Menyiapkan PDF...';

      const exportStyle = document.createElement('style');
      exportStyle.innerHTML = `
        #receiptCapture *, #receiptCapture { animation: none !important; transition: none !important; }
        .paper-texture { display: block !important; mix-blend-mode: normal !important; opacity: 0.15 !important; }
      `;
      document.head.appendChild(exportStyle);

      const bodyChildrenBefore = new Set(Array.from(document.body.children));

      try {
        const el = document.getElementById('receiptCapture');

        await waitForImagesToLoad(el);
        if(document.fonts && document.fonts.ready){
          try { await document.fonts.ready; } catch(e){ /* ignore */ }
        }

        const tanggal = document.getElementById('inputTanggal').value || '';
        const tanggalFmt = tanggal ? tanggal.split('-').reverse().join('') : 'tanpatanggal';
        const nomor = (document.getElementById('inputNomor').value || 'noorder').replace(/[^a-zA-Z0-9]/g,'');
        const filename = `Kuitansi_Sahaja-${tanggalFmt}-${nomor}.pdf`;

        const opt = {
          margin: 0,
          filename: filename,
          image: { type: 'jpeg', quality: 0.95 },
          html2canvas: {
            scale: 2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#41708d',
            scrollY: 0,
            scrollX: 0,
            imageTimeout: 15000,
            onclone: function(clonedDoc) {
              const style = clonedDoc.createElement('style');
              style.innerHTML = `
                * { animation: none !important; transition: none !important; }
                .paper-texture { display: block !important; mix-blend-mode: normal !important; opacity: 0.15 !important; }
              `;
              clonedDoc.head.appendChild(style);

              // PERBAIKAN: Menyisipkan elemen bayangan fisik secara langsung ke dalam DOM klon
              const clonedPaper = clonedDoc.getElementById('paperWrap');
              if(clonedPaper){
                const shadowLayer = clonedDoc.createElement('div');
                shadowLayer.style.cssText = `
                  position: absolute;
                  inset: 0;
                  background: #ffffff;
                  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55);
                  z-index: -1;
                  border-radius: 4px;
                `;
                clonedPaper.appendChild(shadowLayer);
              }
            }
          },
          jsPDF: {
            unit: 'px',
            format: [el.offsetWidth, el.offsetHeight + 10],
            orientation: 'portrait'
          }
        };

        const pdfBlob = await withTimeout(
          html2pdf().set(opt).from(el).toPdf().output('blob'),
          25000,
          'Pembuatan PDF melebihi batas waktu (25 detik). Coba lagi atau gunakan browser lain.'
        );

        const blobUrl = URL.createObjectURL(pdfBlob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();

        statusEl.style.color = 'var(--accent-dark)';
        statusEl.innerHTML = 'PDF siap. Jika unduhan tidak otomatis dimulai, <a href="' + blobUrl +
          '" download="' + filename + '" style="color:var(--accent-dark);font-weight:700;text-decoration:underline;">klik di sini untuk mengunduh</a> ' +
          'atau <a href="' + blobUrl + '" target="_blank" rel="noopener" style="color:var(--accent-dark);font-weight:700;text-decoration:underline;">buka di tab baru</a>.';
        statusEl.style.display = 'block';

        btn.disabled = false;
        btn.textContent = originalLabel;
      } catch(err){
        showError('Gagal membuat PDF: ' + (err && err.message ? err.message : 'silakan coba lagi.') +
          ' Jika masalah berlanjut: coba browser lain (Chrome disarankan), pastikan koneksi internet aktif, dan buka halaman ini lewat alamat web (bukan file lokal).');
      } finally {
        cleanupStrayOverlays(bodyChildrenBefore);
        if (exportStyle.parentNode) {
          exportStyle.parentNode.removeChild(exportStyle);
        }
      }
    }
</script>
</body>
